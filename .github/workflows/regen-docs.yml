name: Regenerate Docs from Issues

on:
  push:
    branches: [main]
  issues:
    types: [labeled, unlabeled, closed, reopened, edited]
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PHOTONFORGE_GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Regenerate docs from GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.PHOTONFORGE_GITHUB_TOKEN }}
        run: python -m scripts.generate_docs

      - name: Commit regenerated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev-docs/living-user-needs.md dev-docs/photonforge-architecture.md
          git diff --staged --quiet || git commit -m "docs: auto-regenerate from GitHub Issues [skip ci]"
          git push

      # MkDocs Pages publish removed (HB-3 Step 1, 2026-05-27).
      # Wiki is now the primary dev doc surface; published by wiki-publish.yml
      # (HB-3 Step 4) which runs after this workflow completes.
