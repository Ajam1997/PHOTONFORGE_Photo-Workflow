name: Regenerate Docs from Issues

on:
  push:
    branches: [main]
  issues:
    types: [labeled, unlabeled, closed, reopened, edited]
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Falls back to the workflow token when the PAT secret is absent/expired
          # (every run had been failing at checkout with a prompt error).
          token: ${{ secrets.PHOTONFORGE_GITHUB_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Regenerate docs from GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.PHOTONFORGE_GITHUB_TOKEN || github.token }}
        run: python -m scripts.generate_docs

      # Fail here instead of committing corrupted output to the repo + wiki.
      - name: Validate generated docs
        run: python -m scripts.validate_generated_docs

      - name: Commit regenerated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # All four generated files (roadmap + kpm-dashboard were previously
          # regenerated but never committed, leaving them permanently stale).
          git add dev-docs/
          git diff --staged --quiet || git commit -m "docs: auto-regenerate from GitHub Issues [skip ci]"
          git push

      # MkDocs Pages publish removed (HB-3 Step 1, 2026-05-27).
      # Wiki is now the primary dev doc surface; published by wiki-publish.yml
      # (HB-3 Step 4) which runs after this workflow completes.
