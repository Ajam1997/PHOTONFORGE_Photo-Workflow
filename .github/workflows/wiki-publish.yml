name: Publish Dev Docs to Wiki

# HB-3 Step 4 — auto-publish dev-docs/ to the GitHub Wiki on merge to main.
#
# Chains after regen-docs.yml via workflow_run so the wiki always reflects
# the latest AUTO-regenerated state (living-user-needs.md, roadmap.md,
# photonforge-architecture.md, kpm-dashboard.md), not a stale snapshot.
#
# Auth: requires a **classic** Personal Access Token with the `repo` scope,
# stored as the `WIKI_PUSH_TOKEN` secret. Fine-grained PATs do NOT support
# wiki write access — they fail with HTTP 403. GITHUB_TOKEN also cannot push
# to the wiki repo.
#
# Setup checklist:
#   1. GitHub → Settings → Developer settings → Personal access tokens →
#      Tokens (classic) → Generate new token (classic)
#      - Note: "PHOTONForge wiki push"
#      - Scope: `repo` (full control of private repositories; this is the
#        narrowest scope that includes wiki write on a private repo).
#      - Expiration: 1 year recommended.
#   2. Copy the token (only shown once).
#   3. Repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: WIKI_PUSH_TOKEN
#      Value: <paste token>
#   4. Trigger this workflow manually (Actions tab → Publish Dev Docs to Wiki
#      → Run workflow) to verify auth.

on:
  workflow_run:
    workflows: ["Regenerate Docs from Issues"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "dev-docs/**"
      - ".github/workflows/wiki-publish.yml"
      - "dev-docs/_wiki-nav.yml"
  workflow_dispatch:

# Prevent overlapping wiki pushes — two PRs merged back-to-back must serialize.
concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip if the upstream regen workflow failed (only relevant for workflow_run trigger)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install systems-first package
        run: pip install "systems-first @ git+https://x-access-token:${{ secrets.PHOTONFORGE_READ_TOKEN }}@github.com/Ajam1997/PHOTONFORGE@v0.1.0#subdirectory=packages/systems-first"

      - name: Verify WIKI_PUSH_TOKEN is set
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          if [ -z "$WIKI_PUSH_TOKEN" ]; then
            echo "::error::WIKI_PUSH_TOKEN secret is not set. See workflow file for setup instructions."
            exit 1
          fi
          echo "WIKI_PUSH_TOKEN is set (length: ${#WIKI_PUSH_TOKEN})."

      - name: Publish wiki
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: sf-wiki --push
