name: Nightly Drift Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The built-in token covers checkout / issue writes / same-repo pushes.
          # (The PHOTONFORGE_GITHUB_TOKEN secret went stale and a present-but-
          # expired PAT defeats a '||' fallback — every run failed at checkout.)
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Run drift check
        id: drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Capture the exit code so the report still gets committed, then
        # surface it: '|| true' used to swallow the red flag entirely.
        run: |
          set +e
          python -m scripts.check_drift
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit drift reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev-docs/drift-reports/index.md dev-docs/drift-reports/*.md || true
          git diff --staged --quiet || git commit -m "docs: add nightly drift report [skip ci]"
          git push || true

      - name: Fail on drift findings
        if: steps.drift.outputs.exit_code != '0'
        run: |
          echo "check_drift reported findings (exit ${{ steps.drift.outputs.exit_code }}) — see the committed report."
          exit 1

      # MkDocs Pages publish removed (HB-3 Step 1, 2026-05-27).
      # Dev docs are now read from the GitHub Wiki; the dev-docs/ -> Pages render is
      # deprecated and will be revived later for user-facing documentation.
