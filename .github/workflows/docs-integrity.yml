name: docs-integrity

# Reference-integrity checks (docs overhaul plan, Phase 2 / decision D5):
# the diff-aware step is BLOCKING (it only flags references broken by the
# PR's own deletions, so it never blames a PR for pre-existing rot); the
# full-repo scan stays informational and also runs nightly.

on:
  pull_request:

jobs:
  doc-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # BLOCKING since 2026-07-10 (backlog cleared by overhaul Phases 3-4):
      # only flags references broken by this PR's own deletions/renames.
      - name: References broken by this PR (diff-aware)
        run: python -m scripts.check_doc_references --pr-mode "origin/${{ github.base_ref }}"

      - name: Full-repo reference scan (informational)
        continue-on-error: true
        run: python -m scripts.check_doc_references

      - name: Install systems-first package
        run: pip install "systems-first @ git+https://x-access-token:${{ secrets.PHOTONFORGE_READ_TOKEN }}@github.com/Ajam1997/PHOTONFORGE@v0.2.0#subdirectory=packages/systems-first"
      - name: Doc conventions (sf-style, diff-aware)
        run: sf-style --pr-mode "origin/${{ github.base_ref }}"
