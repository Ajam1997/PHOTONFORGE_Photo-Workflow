name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev + docs + gui extras
        run: pip install -e ".[dev,docs,gui]"
      # cartridge_manager (PySide6) tests run headless via QT_QPA_PLATFORM=offscreen
      # (set in tests/conftest.py too, belt-and-suspenders) — needs libEGL even
      # without a real display.
      - name: Install Qt runtime deps (offscreen rendering)
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Run test suite
        run: python -m pytest -m "not slow"
        env:
          QT_QPA_PLATFORM: offscreen
      # The Lua plugin builds photo-cartridge command strings by hand; this
      # loads runner.lua against a stubbed darktable and asserts them, so a
      # panel button can't silently drift from the CLI it invokes.
      - name: Install Lua (plugin command-string tests)
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua plugin tests
        run: lua5.4 tests/lua/test_runner_cartridge.lua
      # Informational until the 60 pre-existing lint findings are burned down
      - name: Ruff lint (non-blocking)
        run: ruff check src/ tests/
        continue-on-error: true
