[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-workflow"
version = "0.1.0"
description = "Autonomous Localized Mobile Photography Workflow"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "Pillow>=10.3",
    "imagehash>=4.3",
    "onnxruntime>=1.18",
    "rawpy>=0.21",
    "exifread>=3.0",
    "tqdm>=4.66",
    "click>=8.1",
    "scipy>=1.13",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "memory-profiler>=0.61",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
photo-cartridge = "photo_workflow.cartridge:main"

[project.gui-scripts]
photo-workflow = "photo_workflow.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that require hardware or long runtimes (deselect with -m 'not slow')",
    "integration: end-to-end pipeline tests with fixture images (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
