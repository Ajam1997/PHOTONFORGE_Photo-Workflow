[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-workflow"
version = "0.1.0"
description = "Autonomous Localized Mobile Photography Workflow"
requires-python = ">=3.11"
dependencies = [
    # <5: cv2 5.x changes HoughLinesP output handling (composition.py); unpinned installs broke 13 tests
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26",
    "Pillow>=10.3",
    "imagehash>=4.3",
    "onnxruntime>=1.18",
    "rawpy>=0.21",
    "exifread>=3.0",
    "tqdm>=4.66",
    "click>=8.1",
    "scipy>=1.13",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "pytest-cov>=5.0",
    "memory-profiler>=0.61",
    "ruff>=0.4",
    "mypy>=1.10",
    # Widget/signal tests for cartridge_manager (Cartridge Manager plan Task 4);
    # needs a Qt binding present too — install alongside the `gui` extra.
    "pytest-qt>=4.4",
]
train = [
    "scikit-learn>=1.4",
]
build = [
    # Verified against 6.22.2 (portable-drive plan Task 6); a real onedir
    # freeze of both console scripts, exercising onnxruntime/cv2/tokenizers/
    # rawpy at runtime, not just at import-graph-analysis time.
    "pyinstaller>=6.0",
]
provision = [
    # config/portable-manifest.yml (portable-drive plan Task 2/7) is YAML.
    "PyYAML>=6.0",
]
docs = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "mkdocs-material>=9.5",
    "responses>=0.25",
]
gui = [
    # Cartridge Manager desktop app (Cartridge Manager plan Task 4) — this
    # extra is Windows-target-facing, but the shell itself runs anywhere Qt
    # runs, which is what lets it be developed/tested on Linux.
    "PySide6>=6.6",
]

[project.scripts]
photo-workflow = "photo_workflow.pipeline:main"
photo-cartridge = "photo_workflow.cartridge:main"
cartridge-manager = "cartridge_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photo_workflow = ["data/*.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that require hardware or long runtimes (deselect with -m 'not slow')",
    "integration: end-to-end pipeline tests with fixture images (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
