# config/stages.yml — Phase model
#
# This project's lifecycle stages. Each entry maps 1:1 to a GitHub
# Milestone (created on the Milestones tab).
#
# Reconciled 2026-07-10 (docs overhaul, decision D2): the unedited
# template preset here contradicted requirements/requirement-map.yml
# AND the live milestones (three competing registries). This file now
# mirrors the canonical map in requirements/requirement-map.yml, which
# in turn mirrors the live milestones and each UN issue's **Stage:**
# body field. If stages change, update requirement-map.yml first and
# keep this file in sync.
#
# Schema:
#   stages:
#     <stage-number>:
#       title: <full milestone title, "Stage N — <name>">
#       user_needs: [<list of UN-IDs to be completed in this stage>]

stages:
  1:
    title: "Stage 1 — Project Scaffold & Agent Roster"
    user_needs: [UN-001, UN-002, UN-003]
  2:
    title: "Stage 2 — Core Analysis Engine"
    user_needs: [UN-010, UN-011, UN-012, UN-013, UN-014]
  3:
    title: "Stage 3 — Inference & Darktable Bridge"
    user_needs: [UN-020, UN-021, UN-022]
  4:
    title: "Stage 4 — Host Integration"
    user_needs: [UN-030, UN-031, UN-032]
  5:
    title: "Stage 5 — Staged Pipeline CLI"
    user_needs: [UN-050, UN-051, UN-052, UN-053, UN-054]
  6:
    title: "Stage 6 — SD Staging & Safe Removal"
    user_needs: [UN-040]
  7:
    title: "Stage 7 — GUI & Full Integration"
    user_needs: [UN-041]
