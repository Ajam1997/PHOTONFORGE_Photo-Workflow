# requirements/requirement-map.yml
#
# First-draft decomposition tree for photo-workflow, populated during
# Phase 3 of dev-docs/migration-plan.md.
#
# Sources:
#   - 21 type:user-need Issues  (UN numbers preserved from original labels)
#   - 13 type:fr Issues         (FR -> Parent UN extracted from Issue bodies)
#   - 4 type:nfr Issues         (NFR -> Parent UN extracted from bodies;
#                                NFR-2.4 has a known duplicate, see notes below)
#   - 10 type:kpm Issues        (KPM->FR/UN inferred from titles + CLAUDE.md
#                                context; some are cross-cutting and unparented)
#
# Stage mapping per Decision #2: photo-workflow's original 6 stages remap to
# the template Profile A 5-stage flow (Scaffold -> Core Engine -> Integration
# -> V&V -> Release).
#
# Phase 4 RESOLVED (applied to GitHub 2026-05-29):
#   - NFR-2.4 duplicate (#60/#62): #60 stays NFR-2.4 (UN-030); #62
#     renumbered to NFR-2.5 (UN-041, eject notification).  [DONE]
#   - "Fixture Corpus" (#75): reclassified type:fr -> verification
#     fixture; type:fr label removed.  [DONE]
#   - NFR-2.2 (Resource Budget) created as Issue #88; KPM-1.3 + KPM-1.9
#     re-parented to it via parent_nfrs.  [DONE]
#   - FR-1.7.1 / FR-1.7.2 -> UN-020 + UN-022 multi-parent links kept
#     (consistent with their design-body content).
#
# Phase 5 DONE: dev-docs/architecture/system-architecture-contracts.md
#   maps 10 modules + the cross-module interface seed list.
#
# Phase 6 DONE (2026-05-29): 5 internal module interfaces formalized as
#   IF Issues #89-93 + ICD docs under requirements/interfaces/:
#     IF-1.1 (#89) Lua plugin <-> CLI    — the cross-language contract
#     IF-2.1 (#90) scoring internals     — points to scoring-module-contracts.md
#     IF-3.1 (#91) Genre -> Scoring/Naming
#     IF-3.2 (#92) Scoring/Naming -> Darktable bridge
#     IF-4.1 (#93) Ingest -> pipeline
#
# Phase 7 DONE (2026-05-29): agent roster migrated to template names.
#   architect->systems_lead, engineer->software_lead, devops folded into
#   software_lead. Swept across .claude/agents/, CLAUDE.md, and 11 Issue
#   bodies (#31,63,64,65,68-74).
#
# Still open: Phase 8 (run render chain), Phase 9 (cleanup).

# ============================================================================
# Stage -> UN map (template Profile A 5-stage flow)
# ============================================================================

stages:
  1:
    title: "Stage 1 — Scaffold & Foundation"
    user_needs: [UN-001, UN-002, UN-003]
  2:
    title: "Stage 2 — Core Engine"
    user_needs: [UN-010, UN-011, UN-012, UN-013, UN-014, UN-020, UN-021, UN-022]
  3:
    title: "Stage 3 — Integration"
    user_needs: [UN-030, UN-031, UN-032, UN-040, UN-041]
  4:
    title: "Stage 4 — V&V"
    user_needs: [UN-050, UN-051, UN-052, UN-053, UN-054]
  5:
    title: "Stage 5 — Release"
    user_needs: []

