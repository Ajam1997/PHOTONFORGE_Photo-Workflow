# requirements/requirement-map.yml
#
# First-draft decomposition tree for photo-workflow, populated during
# Phase 3 of dev-docs/migration-plan.md.
#
# Sources:
#   - 21 type:user-need Issues  (UN numbers preserved from original labels)
#   - 13 type:fr Issues         (FR -> Parent UN extracted from Issue bodies)
#   - 4 type:nfr Issues         (NFR -> Parent UN extracted from bodies;
#                                NFR-2.4 has a known duplicate, see notes below)
#   - 10 type:kpm Issues        (KPM->FR/UN inferred from titles + CLAUDE.md
#                                context; some are cross-cutting and unparented)
#
# Stage mapping per Decision #2: photo-workflow's original 6 stages remap to
# the template Profile A 5-stage flow (Scaffold -> Core Engine -> Integration
# -> V&V -> Release).
#
# Known issues flagged for Phase 4 normalization:
#   - NFR-2.4 has two Issues (#60 and #62) with the same label.
#     Phase 4: split into NFR-2.4 (zenity SD-without-SSD) + NFR-2.5
#     (or merge into one Issue if specifications are identical).
#   - "Fixture Corpus" (#75) is labeled type:fr but is a test artifact,
#     not a functional requirement. Phase 4: reclassify as verification
#     fixture, remove from FR list.
#   - UN-022 (genre+scoring semantic filenames) is currently unwired
#     downward. Likely belongs to FR-1.7.1 / FR-1.7.2 family. Confirm
#     in Phase 4.
#   - FR-1.7.1 and FR-1.7.2 bodies don't explicitly cite Parent UN.
#     Inferred as UN-020 + UN-022 (multi-parent). Confirm in Phase 4.
#   - Several KPMs (1.3, 1.4, 1.5, 1.9) are cross-cutting and don't fit
#     a single parent UN; they're listed under UN-030 + UN-031 ranges
#     as a placeholder. Phase 5 (architecture-contracts) may surface
#     better parents.
#   - No IF requirements exist yet. Photo-workflow is a single-discipline
#     (software) project, so cross-discipline IFs don't apply. Internal
#     module IFs (e.g. scoring->fusion) are partially captured in
#     dev-docs/architecture/scoring-module-contracts.md; Phase 6 will
#     promote them to formal IF Issues + ICDs.

# ============================================================================
# Stage -> UN map (template Profile A 5-stage flow)
# ============================================================================

stages:
  1:
    title: "Stage 1 — Scaffold & Foundation"
    user_needs: [UN-001, UN-002, UN-003]
  2:
    title: "Stage 2 — Core Engine"
    user_needs: [UN-010, UN-011, UN-012, UN-013, UN-014, UN-020, UN-021, UN-022]
  3:
    title: "Stage 3 — Integration"
    user_needs: [UN-030, UN-031, UN-032, UN-040, UN-041]
  4:
    title: "Stage 4 — V&V"
    user_needs: [UN-050, UN-051, UN-052, UN-053, UN-054]
  5:
    title: "Stage 5 — Release"
    user_needs: []

