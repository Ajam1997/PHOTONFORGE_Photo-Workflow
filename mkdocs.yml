site_name: PHOTONForge
site_description: Autonomous ingest-to-edit photography pipeline
site_url: https://Ajam1997.github.io/PHOTONFORGE_Photo-Workflow
repo_url: https://github.com/Ajam1997/PHOTONFORGE_Photo-Workflow
repo_name: Ajam1997/PHOTONFORGE_Photo-Workflow
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - User Needs: living-user-needs.md
  - Architecture: photonforge-architecture.md
  - KPM Dashboard: kpm-dashboard.md
  - Research:
    - Overview: research/index.md
    - Scoring Redesign: research/scoring-redesign.md
  - Specs & Plans:
    - Overview: superpowers/index.md
    - Specs:
      - PR Automation: superpowers/specs/2026-05-23-pr-automation-design.md
      - Doc Reorganisation: superpowers/specs/2026-05-23-doc-reorg-design.md
      - GitHub Scaffolding: superpowers/specs/2026-05-23-github-scaffolding-design.md
      - Genre-Aware Scoring: superpowers/specs/2026-05-21-genre-aware-scoring-design.md
      - Pipeline v2: superpowers/specs/2026-05-20-pipeline-v2-design.md
      - Terminal Flash Bugfix: superpowers/specs/2026-05-14-terminal-flash-bugfix-design.md
      - Darktable Lua Plugin: superpowers/specs/2026-05-13-darktable-lua-plugin-design.md
      - Stage-Based CLI: superpowers/specs/2026-05-12-stage-based-cli-design.md
      - Cartridge Identity Redesign: superpowers/specs/2026-04-23-cartridge-identity-redesign.md
      - Ingest Pipeline: superpowers/specs/2026-04-20-ingest-pipeline-design.md
      - Cartridge Provisioning: superpowers/specs/2026-04-20-cartridge-provisioning-design.md
      - Stage 7.2 Ingest Cartridge: superpowers/specs/2026-04-19-stage-7-2-ingest-cartridge-design.md
      - Stage 7.1 GUI Scaffold: superpowers/specs/2026-04-17-stage-7-1-gui-scaffold-design.md
      - SSH Key Update: superpowers/specs/2026-04-17-ssh-key-update-design.md
      - Soak Test Notifications: superpowers/specs/2026-04-16-soak-test-notifications-design.md
    - Plans:
      - Doc Reorganisation: superpowers/plans/2026-05-23-doc-reorg.md
      - GitHub Scaffolding: superpowers/plans/2026-05-23-github-scaffolding.md
      - Genre-Aware Scoring: superpowers/plans/2026-05-21-genre-aware-scoring.md
      - Pipeline v2: superpowers/plans/2026-05-20-pipeline-v2.md
      - Terminal Flash Bugfix: superpowers/plans/2026-05-14-terminal-flash-bugfix.md
      - Python Engine Changes: superpowers/plans/2026-05-13-python-engine-changes.md
      - Lua Plugin: superpowers/plans/2026-05-13-lua-plugin.md
      - Stage-Based CLI: superpowers/plans/2026-05-12-stage-based-cli.md
      - Cartridge Identity Redesign: superpowers/plans/2026-04-23-cartridge-identity-redesign.md
      - Ingest Pipeline: superpowers/plans/2026-04-20-ingest-pipeline.md
      - Cartridge Provisioning: superpowers/plans/2026-04-20-cartridge-provisioning.md
      - Stage 7.2 Ingest Cartridge: superpowers/plans/2026-04-19-stage-7-2-ingest-cartridge.md
      - Stage 7.1 GUI Scaffold: superpowers/plans/2026-04-17-stage-7-1-gui-scaffold.md
