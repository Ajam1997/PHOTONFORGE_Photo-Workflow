      - 2026-04-16 Build Log: PlanningBriefs/2026-04-16-build-log.md
      - 2026-04-15 Brief: PlanningBriefs/2026-04-15-planning-brief.md
      - 2026-04-15 Build Log: PlanningBriefs/2026-04-15-build-log.md
  - GitHub Integration: github-integration-subprojects.md
  - Notes: Notes.md

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
