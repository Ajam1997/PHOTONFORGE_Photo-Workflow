# Wiki sidebar configuration
#
# Consumed by scripts/migrate_wiki.py to generate _Sidebar.md for the
# GitHub Wiki. This is the single source of truth for wiki navigation.
# Do not edit _Sidebar.md on the wiki directly — your edits will be
# overwritten on the next push (unless the wiki page is tagged
# WIKI:LOCAL-ONLY, which _Sidebar.md should not be).
#
# Schema:
#   sections:                # ordered groups in the sidebar
#     - title: "<heading>"   # section heading (omit for the lead group)
#       items:
#         - label: "<text>"  # display text on the wiki sidebar
#           page: "<path>"   # path relative to dev-docs/, with .md
#
# Filename → wiki page name auto-derives from the path (title-cased
# components joined with `-`). Example:
#   architecture/doc-source-of-truth.md  →  Architecture-Doc-Source-Of-Truth
# Special: index.md → Home; <dir>/index.md → <Dir>.
#
# Archived pages (dev-docs/Archive/) are still published but deliberately
# not listed here — reach them via the Archive index.

